<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veckans Bästa</title>

<style>

@font-face {
    font-family: 'RobotoCondensed';
    src: url('./fonts/RobotoCondensed-Regular.ttf') format('truetype');
}

@font-face {
    font-family: 'RobotoCondensedBold';
    src: url('./fonts/RobotoCondensed-Bold.ttf') format('truetype');
}


/* ==========================
   ADMIN
========================== */

#roundSelect {
    margin-right: 15px;

    position: relative;
    top: 3px;

    background: #111;
    color: #fff;

    border: 2px solid #e2c500;
    border-radius: 20px;

    padding: 12px 16px;

    font-size: 14px;
    font-weight: 700;

    height: 44px;
}

body{
    box-sizing:border-box;

    font-family:RobotoCondensed;
    background:#ffffff;

    display:flex;
    flex-direction:column;

    justify-content: center;  /* höjdled */
    align-items: center;      /* sidled */

    min-height: 100vh;}

.header{
    width:400px;

    background:#000;
    border-radius:36px;

    padding:30px;
    box-sizing:border-box;
    margin-top:20px;
    margin-bottom:30px;


    text-align:center;
}

.logo{
    width:340px;
    height:auto;
    display:block;
    margin:0 auto 20px;
    object-fit:contain;
    
}

.introText{
    color:#ffffff;

    font-size:20px;
    line-height:1.4;

    margin:15px 0;
}

.formatText{

    color:#dfc206;

    font-size:18px;

    font-style:italic;
}

.buttonBar{
    margin-bottom:0px;
}

button{
    background:#dfc206;
    color:#1b1b1b;

    border:none;
    border-radius:20px;

    padding:13px 22px;

    cursor:pointer;

    font-weight:bold;
    font-size:15px;

    margin-right:10px;
}

button:hover{
    filter:brightness(1.2);
}

/* ==========================
   GENERERAT KORT
========================== */

.renderCard{

    width:1080px;
    height:1440px;

    position:relative;

    background-image:url('images/graphics/vb_background.jpg');
    background-size:cover;
    background-position:center;

    overflow:hidden;

    box-shadow:
        0 25px 30px rgba(0,0,0,.25);
}

/* ==========================
   VINNARBILD
========================== */

.winnerPhoto{
    position:absolute;

    right:-50px;
    top:60px;

    width:auto;
    height:1060px;

    z-index:5;

    filter:
        brightness(1.00)
        saturate(1.00)
        drop-shadow(
            0 0 50px rgba(255,255,255,0.33)
        );

}

.player2{
    right:250px;
    top:200px;
    width:auto;
    height: 780px;
    z-index:4;
    filter:
        brightness(0.95)
        saturate(1.0);
}

.player3{
    right:420px;
    top:300px;
    width:auto;
    height:660px;
    z-index:3;
    filter:
        brightness(0.9)
        saturate(1.0);
}

.player4{
    right:590px;
    top:380px;
    width:auto;
    height:550px;
    z-index:2;
    filter:
        brightness(0.85)
        saturate(1.0);
}

.player5{
    right:730px;
    top:425px;
    width:auto;
    height:480px;
    z-index:1;
    filter:
        brightness(0.80)
        saturate(1.0);
}

/* ==========================
   OVERLAY
========================== */

.overlay{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:6;

    pointer-events:none;
}

.matchInfo{

    position:absolute;

    left:90px;

    top:340px;

    z-index:10;
}

.divisionText{

    font-family:'RobotoCondensed';

    font-size:28px;

    color:#ffffff;

    margin-top:5px;

    text-shadow:0 2px 4px rgba(0,0,0,.75);
}

.roundText{

    font-family:'RobotoCondensedBold';

    font-size:34px;

    color:#d7cc22;

    text-transform:uppercase;

    text-shadow:0 2px 4px rgba(0,0,0,.95);
}

/* ==========================
   TOPPLISTA
========================== */

.topList{

    position:absolute;

    left:90px;
    top:680px;

    width:720px;

    z-index:10;
}

.rankRow:first-child{
    margin-bottom:20px;
}

.rankRow{
    display:grid;

    grid-template-columns:1fr 100px;

    align-items:start;

    margin-bottom:12px;
}

.rankName{
    font-family:'RobotoCondensed';

    font-size:40px;
    line-height:0.9;

    color:#d0d0d0;

    white-space:nowrap;

    text-shadow:0 2px 4px rgba(0,0,0,.75);
}

.rankScore{
    font-family:'RobotoCondensed';

    font-size:40px;
    line-height:0.9;

    text-align:right;

    color:#d0d0d0;

    white-space:nowrap;

    text-shadow:0 2px 4px rgba(0,0,0,.75);
}

.rankWinner{
    font-family:'RobotoCondensedBold';
    color:#d7cc22;
}

.winnerSize{
    font-size:60px;
}

#cardsContainer{
    display:none;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-start;

    gap:40px;

    width:100%;

    background:#7a7a7a;

    padding:40px 0;
}

.teamCardWrapper{

    width:360px;

    display:flex;

    flex-direction:column;

    align-items:center;
}

.teamTitle{

    color:white;

    font-size:24px;

    font-weight:bold;

    margin-bottom:10px;
}

.cardPreview{

    width:324px;
    height:480px;

    position:relative;

    max-width:100%;

    overflow:visible;
    
}

.exportTeamBtn{

    width:324px;
    
    position:relative;

    background:#000000;
    color:white;

    border: 2px solid #dfc206;
    
    border-radius:20px;

    cursor:pointer;

    font-weight:bold;

    font-size:15px;

    margin-top:-30px;
    margin-bottom:20px;

}

@media (max-width:300px){

    .header{
    width:100%;

    }  

    .buttonBar{
    display:flex;
    justify-content:center;
    align-items:center;

    gap:25px;

    margin:0;
    }
    
    .buttonBar button{

        width:100%;
    }

    #cardsContainer{

        display:block;
    }

    .teamCardWrapper{

        width:100%;

        margin-bottom:0px;
    }

}

</style>
</head>

<body>

<div class="header">

    <img
        src="images/graphics/vb_logo.png"
        class="logo">

    <p class="introText">
        Genererar bilder med topp 5 resultat<br>
        för vald omgång, för alla fyra lag.
    </p>

    <p class="formatText">
        Format: PNG-bild i 1080x1350 px (4:5)
    </p>

    <div class="buttonBar">

        <select id="roundSelect">
            <option value="">Laddar...</option>
        </select>

        <button id="generateBtn">
            Generera alla lag
        </button>

    </div>

</div>

<div id="cardsContainer"></div>


<script>

const generateBtn = document.getElementById('generateBtn');

const roundSelect =
    document.getElementById('roundSelect');

const OVERLAY_IMAGE =
    'images/graphics/vb_overlay.png';

const TEAMS = {

    a: {
        name: 'A-laget'
    },

    f1: {
        name: 'Farmen 1'
    },

    f2: {
        name: 'Farmen 2'
    },

    b: {
        name: 'B-laget'
    }

};

let playerImages = {};

let availableRounds = new Set();

fetch('data/player-images.json')
    .then(response => response.json())
    .then(data => {

        playerImages = data;

    });


/* ==========================
   GENERERA KORT
========================== */

generateBtn.addEventListener('click', async () => {

    const selectedRound =
        parseInt(roundSelect.value);

    if (!selectedRound) return;

    generateBtn.disabled = true;
    generateBtn.textContent = 'Genererar...';
    generateBtn.style.background = '#666';
    generateBtn.style.color = '#fff';

    const teamMatchA =
        await loadTeamFromBits('a', selectedRound);

    const teamMatchF1 =
        await loadTeamFromBits('f1', selectedRound);

    const teamMatchF2 =
        await loadTeamFromBits('f2', selectedRound);

    const teamMatchB =
        await loadTeamFromBits('b', selectedRound);

    window.bitsMatchInfo =
        window.bitsMatchInfo || {};

    window.bitsMatchInfo['a'] = teamMatchA;
    window.bitsMatchInfo['f1'] = teamMatchF1;
    window.bitsMatchInfo['f2'] = teamMatchF2;
    window.bitsMatchInfo['b'] = teamMatchB;

    await loadMatchResults();

    const cardsContainer =
        document.getElementById('cardsContainer');

        cardsContainer.style.display = 'flex';

        cardsContainer.innerHTML = '';

        Object.keys(TEAMS).forEach(teamKey => {

        const team = TEAMS[teamKey];

        const currentMatchInfo =
            window.bitsMatchInfo?.[teamKey];

        const division =
            currentMatchInfo?.matchDivisionName ||
            'Division saknas';

        const round =
            `Omgång ${currentMatchInfo?.matchRoundId || ''}`;

        const results = [];

window.bitsResults[teamKey].forEach(player => {

    const playerName =
        player.player.split(' (')[0];

    results.push({

        name: playerName,

        image:
            playerImages[player.licNbr] ||
            'images/players/default.png',

        score: player.totalResult


    });

});


        if (!results.length) return;

        const topFive = results
            .sort((a,b) => b.score - a.score)
            .slice(0,5);

        const winner = topFive[0];

        const wrapper =
            document.createElement('div');

        wrapper.className =
            'teamCardWrapper';

        wrapper.innerHTML = `

<div class="teamTitle">
    ${TEAMS[teamKey].name}
</div>

<div class="cardPreview">

    <div
        class="renderCard"
        id="card-${teamKey}"
        style="transform:scale(0.3);
        transform-origin:top left;">

${topFive.map((player,index) => `

<img
    class="winnerPhoto player${index + 1}"
    src="${player.image}"
    onerror="this.src='images/players/default.png'">

`).join('')}

                <img
                class="overlay"
                src="${OVERLAY_IMAGE}">

                <div class="matchInfo">

                <div class="roundText">
                ${team.name.toUpperCase()} - ${round.toUpperCase()}
            </div>

                <div class="divisionText">
                ${division}
        </div>

</div>

                <div class="topList">

                    ${topFive.map((player,index) => `

                        <div class="rankRow">

                            <div class="rankName ${index === 0 ? 'rankWinner winnerSize' : ''}">
                                ${index + 1}. ${player.name}
                            </div>

                            <div class="rankScore ${index === 0 ? 'rankWinner winnerSize' : ''}">
                                ${player.score}
                            </div>

                        </div>

                    `).join('')}

                </div>

            </div>
</div>

<button
    class="exportTeamBtn"
    data-team="${teamKey}">
    EXPORTERA PNG
</button>

`;
        cardsContainer.appendChild(wrapper);

});

generateBtn.disabled = false;
generateBtn.textContent = 'Generera alla lag';
generateBtn.style.background = '#dfc206';
generateBtn.style.color = '#1b1b1b';

});



/* ==========================
   EXPORTERA PNG
========================== */

const TEAMS_BITS = {
    a: {
        teamId: 90792,
        divisionId: 12
    },
    f1: {
        teamId: 186762,
        divisionId: 927
    },
    f2: {
        teamId: 186767,
        divisionId: 951
    },
    b: {
        teamId: 153567,
        divisionId: 844
    }
};

async function loadTeamFromBits(teamKey, roundId = null) {

    const currentYear = new Date().getFullYear();

    const TEAM = TEAMS_BITS[teamKey];

    const TEAM_ID = TEAM.teamId;
    const DIVISION_ID = TEAM.divisionId;
    const SEASON_ID = currentYear;
    
    const matchesUrl =
    `https://bits.swebowl.se/MiscFrontApiConnector/ListMatches?divisionId=${DIVISION_ID}&seasonId=${SEASON_ID}&matchStatus=`;

    const matchesResponse =
        await fetch(matchesUrl);

    const matches =
        await matchesResponse.json();

    matches
        .filter(m => m.matchHasBeenPlayed)
        .forEach(m =>
            availableRounds.add(m.matchRoundId)
        );

    const varkullaMatches = matches.filter(
        match =>
            match.matchHasBeenPlayed &&
            (
                match.matchHomeTeamId === TEAM_ID ||
                match.matchAwayTeamId === TEAM_ID
            )
);

varkullaMatches.sort(
    (a, b) =>
        new Date(b.matchDateTime) -
        new Date(a.matchDateTime)
);

if (roundId !== null) {

    const roundMatch =
        varkullaMatches.find(
            match => match.matchRoundId == roundId
        );

    return roundMatch || null;
}

const latestMatch =
    varkullaMatches[0];

return latestMatch;

}

async function loadMatchResults() {

    const matchIds = {
        a:  window.bitsMatchInfo.a.matchId,
        f1: window.bitsMatchInfo.f1.matchId,
        f2: window.bitsMatchInfo.f2.matchId,
        b:  window.bitsMatchInfo.b.matchId
    };

    window.bitsResults = {};

    for (const teamKey of ['a', 'f1', 'f2', 'b']) {

        const url =
            `https://bits.swebowl.se/MiscFrontApiConnector/GetMatchResults?matchId=${matchIds[teamKey]}&matchSchemeId=8M8BA`;

        const response =
            await fetch(url);

        const data =
            await response.json();

        const allPlayers = [
            ...data.playerListHome,
            ...data.playerListAway
        ];

        const teamMatch =
            window.bitsMatchInfo[teamKey];

        const varkullaSide =
            teamMatch.matchHomeTeamId ===
            TEAMS_BITS[teamKey].teamId
                ? 'H'
                : 'A';

        const teamPlayers = allPlayers.filter(
            player =>
            player.homeOrAwayTeam === varkullaSide
        );

        window.bitsResults[teamKey] = teamPlayers
            .sort((a, b) => b.totalResult - a.totalResult)
            .slice(0, 5);
    }

}


document.addEventListener('click', async (event) => {

    if (!event.target.classList.contains('exportTeamBtn'))
        return;

const teamKey =
    event.target.dataset.team;

const card =
    document.getElementById(`card-${teamKey}`);

const oldTransform =
    card.style.transform;

card.style.transform = 'none';

const canvas =
    await html2canvas(card,{
        scale:1,
        useCORS:true
    });

card.style.transform =
    oldTransform;

const link =
    document.createElement('a');

link.download =
    `VeckansBasta-${teamKey}.png`;

link.href =
    canvas.toDataURL('image/png');

document.body.appendChild(link);

link.click();

link.remove();

});

window.addEventListener('load', async () => {

console.log('LOAD START');

    await loadTeamFromBits('a');
    await loadTeamFromBits('f1');
    await loadTeamFromBits('f2');
    await loadTeamFromBits('b');

    const rounds =
        [...availableRounds]
            .sort((a, b) => b - a);

    roundSelect.innerHTML = rounds
        .map(round =>
            `<option value="${round}">
                Omgång ${round}
            </option>`
        )
        .join('');

});

</script>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</body>
</html>
