<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Veckans Bästa</title>
</head>
<body>

    <h1>Spelare</h1>
    <div id="players"></div>

    <script>
        fetch('data/players.json')
            .then(response => response.json())
            .then(players => {

                const container = document.getElementById('players');

                players.forEach(player => {

                    const div = document.createElement('div');

                    div.innerHTML = `
                        <h3>${player.name}</h3>
                        <img src="${player.image}" width="150">
                    `;

                    container.appendChild(div);

                });

            })
            .catch(error => {
                console.error('Fel:', error);
            });
    </script>

</body>
</html>
