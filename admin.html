<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veckans Bästa</title>

<style>

@font-face {
    font-family: 'RobotoCondensed';
    src: url('./fonts/RobotoCondensed-Regular.ttf') format('truetype');
}

@font-face {
    font-family: 'RobotoCondensedBold';
    src: url('./fonts/RobotoCondensed-Bold.ttf') format('truetype');
}

/* ==========================
   ADMIN
========================== */

body{
    font-family:Arial,sans-serif;
    padding:30px;
    background:#3a3a3a;
    color:#52010a;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    background:#000000;

    padding:20px 30px;

    border-radius:14px;

    margin-bottom:25px;

    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.header h1{
    margin:0;
    color:white;
    font-size:42px;
    font-family:'RobotoCondensedBold';
}

.logo{
    height:90px;
    width:auto;
}

#playerList{
    background:white;
    border-radius:14px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,.10);
    margin-bottom:20px;
}

.player-row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:8px 0;

    border-bottom:1px solid #dfe6ee;
}

.player-row:last-child{
    border-bottom:none;
}

.player-row label{
    font-size:16px;
    font-weight:600;
    color:#012b52;
}

.player-row input{
    width:90px;
    padding:8px;
    border:1px solid #c8d1db;
    border-radius:8px;
    text-align:center;
    font-size:15px;
}

.buttonBar{
    margin-bottom:25px;
}

button{
    background:#d7cc22;
    color:#012b52;

    border:none;
    border-radius:8px;

    padding:12px 20px;

    cursor:pointer;

    font-weight:bold;
    font-size:15px;

    margin-right:10px;
}

button:hover{
    filter:brightness(1.08);
}

/* ==========================
   GENERERAT KORT
========================== */

#weeklyCard{

    width:1080px;
    height:1350px;

    margin-top:30px;

    position:relative;

    background-image:url('images/graphics/vb_background.jpg');
    background-size:cover;
    background-position:center;

    overflow:hidden;

    display:none;

    box-shadow:0 10px 30px rgba(0,0,0,.25);

    transform-origin:top left;
}

/* ==========================
   VINNARBILD
========================== */

#winnerPhoto{
    position:absolute;

    right:-60px;
    top:-50px;

    width:790px;
    height:auto;

    z-index:1;

    filter:
        drop-shadow(
            0 0 50px rgba(255,255,255,0.33)
        );

}

/* ==========================
   OVERLAY
========================== */

#overlay{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:2;

    pointer-events:none;
}

/* ==========================
   TOPPLISTA
========================== */

#topList{
    position:absolute;

    left:90px;
    top:650px;

    width:720px;

    z-index:10;
}

.rankRow{
    display:grid;

    grid-template-columns:1fr 70px;

    align-items:start;

    margin-bottom:6px;
}

.rankName{
    font-family:'RobotoCondensed';

    font-size:50px;
    line-height:0.9;

    color:#d0d0d0;

    white-space:nowrap;

    text-shadow:0 2px 4px rgba(0,0,0,.75);
}

.rankScore{
    font-family:'RobotoCondensed';

    font-size:50px;
    line-height:0.9;

    text-align:right;

    color:#d0d0d0;

    white-space:nowrap;

    text-shadow:0 2px 4px rgba(0,0,0,.75);
}

.rankWinner{
    font-family:'RobotoCondensedBold';
    color:#d7cc22;
}

.winnerSize{
    font-size:60px;
}

</style>
</head>

<body>

<div class="header">
    <div>
        <h1>Veckans Bästa</h1>
    </div>

    <img
        src="images/graphics/VIK_Bowling_Logo_SMALL.png"
        class="logo">
</div>

<div id="playerList"></div>

<div class="buttonBar">

    <button id="generateBtn">
        Generera Veckans Bästa
    </button>

    <button id="exportBtn">
        Exportera PNG
    </button>

</div>

<div id="weeklyCard"></div>

<script>

const CARD_WIDTH = 1080;

const playerList = document.getElementById('playerList');
const weeklyCard = document.getElementById('weeklyCard');
const generateBtn = document.getElementById('generateBtn');
const exportBtn = document.getElementById('exportBtn');

/* ==========================
   SKALA KORTET
========================== */

function scaleCard() {

    const availableWidth =
        window.innerWidth - 80;

    const scale =
        Math.min(1, availableWidth / CARD_WIDTH);

    weeklyCard.style.transform =
        `scale(${scale})`;
}

/* ==========================
   LADDA SPELARE
========================== */

fetch('data/players.json')
    .then(response => response.json())
    .then(players => {

        playerList.innerHTML = '';

        players.forEach(player => {

            const row =
                document.createElement('div');

            row.className = 'player-row';

            row.innerHTML = `
                <label>${player.name}</label>

                <input
                    type="number"
                    placeholder="Poäng"
                    data-name="${player.name}"
                    data-image="${player.image}">
            `;

            playerList.appendChild(row);

        });

    });

/* ==========================
   GENERERA KORT
========================== */

generateBtn.addEventListener('click', () => {

    const results =
        [...document.querySelectorAll('input[type="number"]')]
        .map(input => ({
            name: input.dataset.name,
            image: input.dataset.image,
            score: Number(input.value) || 0
        }));

    const topFive = results
        .sort((a,b) => b.score - a.score)
        .slice(0,5);

    const winner = topFive[0];

    if (!winner) return;

    weeklyCard.innerHTML = `

        <img
            id="winnerPhoto"
            src="${winner.image}">

        <img
            id="overlay"
            src="images/graphics/vb_overlay.png">

        <div id="topList">

            ${topFive.map((player,index) => `

                <div class="rankRow">

                    <div class="rankName ${index === 0 ? 'rankWinner winnerSize' : ''}">
                        ${index + 1}. ${player.name}
                    </div>

                    <div class="rankScore ${index === 0 ? 'rankWinner winnerSize' : ''}">
                        ${player.score}
                    </div>

                </div>

            `).join('')}

        </div>

    `;

    weeklyCard.style.display = 'block';

    scaleCard();

});

/* ==========================
   EXPORTERA PNG
========================== */

exportBtn.addEventListener('click', () => {

    if (!weeklyCard.innerHTML.trim()) {

        alert('Generera Veckans Bästa först.');
        return;

    }

    html2canvas(weeklyCard,{
        scale:2,
        useCORS:true
    })
    .then(canvas => {

        const today =
            new Date().toISOString().split('T')[0];

        const link =
            document.createElement('a');

        link.download =
            `VeckansBasta-${today}.png`;

        link.href =
            canvas.toDataURL('image/png');

        link.click();

    });

});

/* ==========================
   EVENTS
========================== */

window.addEventListener('resize', scaleCard);
window.addEventListener('load', scaleCard);

</script>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</body>
</html>
